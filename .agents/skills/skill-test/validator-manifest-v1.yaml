{
  "schema": "cgs-skill-test-validator-manifest/v1",
  "version": "1.0.0",
  "runner": {
    "path": ".agents/skills/skill-test/skill_test_rules.py",
    "version": "1.0.0"
  },
  "rules": {
    "path": ".agents/skills/skill-test/rules-v1.yaml",
    "version": "1.0.0"
  },
  "interpreter": {
    "name": "python",
    "minimum_version": "3.11.0",
    "maximum_exclusive_version": "3.14.0",
    "record_resolved_path_and_version": true
  },
  "allowed_argv": [
    ["--repo-root", "<exact-repository-root>", "--mode", "static", "--target", "<canonical-skill-name>"],
    ["--repo-root", "<exact-repository-root>", "--mode", "audit"],
    ["--repo-root", "<exact-repository-root>", "--mode", "manifest"]
  ],
  "timeout_seconds": 30,
  "stdout": "one JSON document only",
  "stderr": "diagnostics only",
  "output_schema": "cgs-skill-test-runner-output/v1",
  "nonzero_exit_or_timeout": "PARTIAL_VALIDATION",
  "writes": []
}
