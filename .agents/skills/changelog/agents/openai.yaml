interface:
  display_name: "Changelog"
  short_description: "Draft local changelog candidates from an exact Git range"
  default_prompt: "Use $changelog with a hash-pinned v2 request to derive deterministic source-bound net-change claims, keep version/date/target/candidate/deployment states separate, sanitize any player projection, and remain read-only unless one absent output target has explicit create-only CAS authority. Never revise history or publish."
